# Python packaging for the `pnm` pore-network-extraction module (peclet.pnm).
#
# `pip install .` builds the Kokkos extension via scikit-build-core and installs it as `peclet.pnm`.
# The Kokkos prefix is NOT pulled from PyPI (it is GPU-arch / backend specific): point the build at a
# prefix you bootstrapped once with ../tools/bootstrap_deps.sh by exporting CMAKE_PREFIX_PATH. The
# backend (Serial / OpenMP / CUDA / HIP) is whatever that prefix was built for — one source, every
# environment.
#
#   # CPU / multicore (OpenMP):
#   CMAKE_PREFIX_PATH=/path/to/extern/install/host-openmp pip install .
#
#   # NVIDIA GPU — put nvcc on PATH first:
#   CMAKE_PREFIX_PATH=/path/to/extern/install/nvidia-cuda pip install .

[build-system]
requires = ["scikit-build-core>=0.8", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "peclet-pnm"
version = "1.0.2"
description = "peclet.pnm — Kokkos pore-network extraction from SDF geometry (pores, watershed segmentation, throat topology)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "E.A.J.F. Peters", email = "e.a.j.f.peters@tue.nl" }]
# The wheels are manylinux x86-64 and there is no Windows or macOS build (suite docs/DEPLOYMENT.md,
# "Operating system"); say so on the PyPI page, where a reader looks before pip tells them.
keywords = ["pore network", "pore scale", "porous media", "watershed", "segmentation", "image analysis"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = ["numpy>=1.20"]

[project.urls]
Homepage = "https://github.com/computational-chemical-engineering/peclet"
Documentation = "https://computational-chemical-engineering.github.io/peclet/"
Source = "https://github.com/computational-chemical-engineering/peclet-pnm"
"Examples gallery" = "https://computational-chemical-engineering.github.io/peclet-examples/"
Issues = "https://github.com/computational-chemical-engineering/peclet-pnm/issues"
Changelog = "https://github.com/computational-chemical-engineering/peclet-pnm/blob/main/CHANGELOG.md"

[tool.scikit-build]
minimum-version = "0.8"
cmake.version = ">=3.24"
# The extension + the peclet/pnm package __init__.py are placed by the CMake install() rules
# (guarded by SKBUILD) into the peclet namespace; disable package auto-discovery so nothing else is added.
wheel.install-dir = "."
wheel.packages = []
sdist.include = ["src", "packaging", "cmake", "CMakeLists.txt", "README.md", "LICENSE"]

# ---------------------------------------------------------------------------
# Self-contained redistributable CPU wheels (cibuildwheel). PECLET_VENDOR_DEPS=ON makes the build
# FetchContent-build Kokkos (OpenMP+Serial) + the peclet-core headers, so the wheel needs no prefix
# and runs multicore on any x86-64 Linux. GPU/HIP stays a source (sdist) / container build.
# Linux-only: the Kokkos build needs a recent toolchain (manylinux_2_28 = GCC 12+, for C++20).
# ---------------------------------------------------------------------------
[tool.cibuildwheel]
# cp314 verified green for all five packages on the 2026-09-13 wheel probe. Without it a user on a
# current Python falls through to a source build on every platform, Linux included -- the same trap
# a missing OS wheel is.
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux* *_i686 *-win32 pp*"
build-frontend = "build"
manylinux-x86_64-image = "manylinux_2_28"
# Real smoke: one spherical pore (SDF > 0 inside, peak at the integer center voxel) must extract as
# exactly one pore of radius R with no throat, and the staged extract_pores must agree.
test-command = "python -c \"import numpy as np, peclet.pnm as p; n, R = 16, 5.5; z, y, x = np.meshgrid(*(np.arange(n, dtype=np.float32),) * 3, indexing='ij'); sdf = (R - np.sqrt((x - 8) ** 2 + (y - 8) ** 2 + (z - 8) ** 2)).astype(np.float32); pores, seg, conns = p.extract_pore_network(sdf, [0.0] * 3, [1.0] * 3); assert len(pores) == 1 and abs(pores[0].radius - R) < 1e-6 and (pores[0].x, pores[0].y, pores[0].z) == (8.0, 8.0, 8.0), pores; assert not [c for c in conns if c[0] > 0 and c[1] > 0], conns; assert len(p.extract_pores(sdf, [0.0] * 3, [1.0] * 3)) == 1; print('peclet.pnm', p.execution_space, 'ok')\""

[tool.cibuildwheel.environment]
PECLET_VENDOR_DEPS = "ON"
