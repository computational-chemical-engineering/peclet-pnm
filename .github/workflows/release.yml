name: Release

# Build + publish to PyPI on a version tag:
#   * peclet-pnm      — sdist + self-contained OpenMP CPU wheels (FetchContent Kokkos OpenMP+Serial,
#                       PECLET_VENDOR_DEPS=ON from [tool.cibuildwheel]).
#   * peclet-pnm-cu13 — single-GPU CUDA wheels (cuda-wheel job): Kokkos-CUDA (static, embedded) built
#                       against CUDA 13; libcudart comes from the `nvidia-cuda-runtime` dependency wheel
#                       (rpath, -DPECLET_CUDA_RUNTIME_WHEEL=ON), not bundled. HIP + multi-GPU MPI stay
#                       source/container.
# Uses PyPI Trusted Publishing (OIDC): register the publisher for BOTH `peclet-pnm` AND `peclet-pnm-cu13`
# on PyPI first (one publisher per project) — no API token secret needed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Every platform peclet has been SHOWN to build on (2026-09-13 wheel probe; suite
  # docs/RELEASE_PREP.md sections 11.2 and 11.3). All four are multi-threaded: Linux gets the OpenMP
  # host backend, Windows and macOS get Kokkos' C++ threads backend, and the build decides that
  # itself -- cmake/PecletDeps.cmake asks find_package for OpenMP 3.0 and falls back, because
  # AppleClang ships no OpenMP and MSVC reports 2.0 whatever runtime is selected. Same numbers from
  # all three; `execution_space` on the installed module reports which one you got.
  #
  # Not here, and why:
  #   macOS x86-64  GitHub has retired the Intel runners -- a macos-13 job now queues forever -- so
  #                 this could only be cross-compiled and never tested. Intel Macs build from the
  #                 sdist, which the same probe showed works.
  #   musllinux     never tried; Alpine is not a peclet audience yet.
  #   win_arm64     no runner, nobody asking.
  wheels:
    name: wheels · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: manylinux x86_64 (OpenMP)
          - os: ubuntu-24.04-arm
            label: manylinux aarch64 (OpenMP)
          - os: windows-latest
            label: win_amd64 (Threads)
          - os: macos-latest
            label: macOS arm64 (Threads)
    steps:
      - uses: actions/checkout@v7
      # cibuildwheel reads [tool.cibuildwheel] from pyproject.toml (PECLET_VENDOR_DEPS=ON): each wheel
      # compiles Kokkos as a subproject, so builds are slow but self-contained.
      - uses: pypa/cibuildwheel@v4.1
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  # peclet-pnm-cu13: single-GPU CUDA wheels. Runs in a manylinux_2_28 container (so the output is a
  # PyPI-uploadable manylinux wheel), installs the CUDA toolkit, builds a Kokkos-CUDA prefix, then
  # builds + repairs the pnm wheel for ONE CPython (one job per interpreter, see below). libcudart is
  # NOT bundled — it is supplied by the `nvidia-cuda-runtime` runtime wheel (declared in
  # packaging/pyproject-cuda.toml) and reached via the module rpath baked by
  # -DPECLET_CUDA_RUNTIME_WHEEL=ON. Mirrors peclet-flow's cuda-wheel job.
  # One job PER INTERPRETER, not one job looping over them. voro's serial loop walked into GitHub's
  # hard 6-hour job cap on 2026-09-14 and took `publish` down with it, publishing nothing for a tag
  # that had already moved (suite docs/RELEASE_PREP.md 11.5). peclet-pnm is nowhere near that cap -- its
  # 1.0.1 run (34788223729) spent 4 m 54 s on four wheels, ~1 m 14 s each, after 4 m 04 s of container +
  # CUDA toolkit + Kokkos setup -- but the fan-out is the better shape regardless, and the family
  # is worth keeping identical here: the divergence between these four files is itself what let the
  # cu13 wheels sit a whole interpreter behind the CPU ones. At five interpreters the serial loop is
  # ~10 min; fanned out it is ~5 min, at the cost of repeating that setup per job.
  #
  # cp310 THROUGH cp314, matching [tool.cibuildwheel] `build` in pyproject.toml. The CPU wheels gained
  # cp314 on 2026-09-13 and this list did not, so 1.0.1 shipped a CPU wheel to a Python 3.14 user and
  # left their `pip install peclet-pnm-cu13` to a source build it cannot do. The two lists are one
  # decision and must move together.
  cuda-wheel:
    name: cuda wheel (peclet-pnm-cu13, ${{ matrix.py }}, manylinux_2_28 x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60          # ~5 min expected; fail as a budget, not as a silent 6 h kill
    strategy:
      fail-fast: false
      matrix:
        py: [cp310-cp310, cp311-cp311, cp312-cp312, cp313-cp313, cp314-cp314]
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    env:
      KOKKOS_TAG: "5.1.1"
      # Kokkos is configured for the SASS baseline (Turing, sm_75: the lowest arch CUDA 13 supports) and
      # nvcc additionally embeds native SASS for every later major (Ampere 80, Hopper 90, Blackwell 100 and
      # 120) through NVCC_APPEND_FLAGS — nvcc reads that variable itself, so it bypasses nvcc_wrapper, which
      # rejects a second -arch/-gencode. The compute_75 PTX stays in the fatbin for architectures newer
      # than the list. Measured 2026-09-06: PTX alone does NOT carry a wheel forward — a driver older than
      # the toolkit that emitted the PTX cannot JIT it, and under minor-version compatibility the launch
      # silently does nothing (Kokkos then aborts with "likely mismatch of architecture"). Hence also the
      # OLDEST 13.x toolkit below, so the PTX JITs on every 13.x driver. (KOKKOS_ARCH name must match
      # CUDA_ARCH number: TURING75/75, AMPERE80/80, HOPPER90/90, BLACKWELL120/120.)
      KOKKOS_ARCH: "TURING75"
      CUDA_ARCH: "75"
      NVCC_APPEND_FLAGS: "-gencode arch=compute_80,code=sm_80 -gencode arch=compute_90,code=sm_90 -gencode arch=compute_100,code=sm_100 -gencode arch=compute_120,code=sm_120"
      CUDA_PKG: "13-0"          # CUDA toolkit package suffix (cuda-nvcc-13-0 …) — the oldest 13.x, see above
      CUDA_HOME: "/usr/local/cuda-13.0"
    steps:
      - uses: actions/checkout@v7

      - name: Install CUDA toolkit (nvcc + cudart devel)
        run: |
          dnf -y install dnf-plugins-core
          dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo
          dnf -y install cuda-nvcc-${CUDA_PKG} cuda-cudart-devel-${CUDA_PKG} cuda-crt-${CUDA_PKG} cuda-nvml-devel-${CUDA_PKG} cuda-driver-devel-${CUDA_PKG}
          echo "${CUDA_HOME}/bin" >> "$GITHUB_PATH"

      - name: Build Kokkos-CUDA prefix (static; embedded in the module)
        run: |
          export PATH="${CUDA_HOME}/bin:$PATH"
          git clone --depth 1 --branch "${KOKKOS_TAG}" https://github.com/kokkos/kokkos.git /tmp/kokkos
          cmake -S /tmp/kokkos -B /tmp/kokkos/build \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/kokkos-cuda" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20 -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_CXX_COMPILER=/tmp/kokkos/bin/nvcc_wrapper \
            -DKokkos_ENABLE_CUDA=ON -DKokkos_ENABLE_SERIAL=ON \
            "-DKokkos_ARCH_${KOKKOS_ARCH}=ON" -DCMAKE_CUDA_ARCHITECTURES="${CUDA_ARCH}"
          cmake --build /tmp/kokkos/build --target install -j

      - name: Build + repair the CUDA wheel for ${{ matrix.py }}
        run: |
          export PATH="${CUDA_HOME}/bin:$PATH"
          export CMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/kokkos-cuda"
          cp packaging/pyproject-cuda.toml pyproject.toml   # -> peclet-pnm-cu13 + nvidia-cuda-runtime dep
          mkdir -p /tmp/raw /tmp/out
          "/opt/python/${{ matrix.py }}/bin/pip" wheel . --no-deps -w /tmp/raw
          # Retag to manylinux (libcudart/libcuda are external: excluded), then re-add the nvidia rpath
          # auditwheel resets, so `import peclet.pnm` finds libcudart in the nvidia-cuda-runtime wheel.
          /opt/python/cp312-cp312/bin/pip install -q auditwheel wheel
          for whl in /tmp/raw/*.whl; do
            /opt/python/cp312-cp312/bin/auditwheel repair \
              --exclude libcudart.so.13 --exclude libcuda.so.1 \
              --plat manylinux_2_28_x86_64 -w /tmp/rep "$whl"
          done
          for whl in /tmp/rep/*.whl; do
            work=$(mktemp -d)
            ( cd "$work" && /opt/python/cp312-cp312/bin/python -m wheel unpack "$whl" )
            pkg=$(ls -d "$work"/*/)
            patchelf --add-rpath '$ORIGIN/../../nvidia/cu13/lib'    "$pkg"peclet/pnm/_pnm*.so
            ( cd "$work" && /opt/python/cp312-cp312/bin/python -m wheel pack "$pkg" -d /tmp/out )
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-cuda-${{ matrix.py }}
          path: /tmp/out/*.whl

  publish:
    needs: [sdist, wheels, cuda-wheel]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Uploads both peclet-pnm (sdist + CPU wheels) and peclet-pnm-cu13 (CUDA wheels); PyPI routes each
      # file by its metadata name. Both projects must have this workflow registered as a trusted publisher.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true   # completing a partial upload (e.g. adding the cu13 files) must not
                                # fail on the already-published peclet-pnm files
