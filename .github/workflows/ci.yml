name: CI

# Build the Kokkos (OpenMP + Serial) backend from source (cached), then build peclet.pnm + EVERY test
# under PECLET_PNM_BUILD_TESTS and run them all:
#   * build-test : the single-rank module + the single-rank C++ contract (tests/kokkos) + the Python
#                  binding smoke + the packing_ring gate (tests/python). The gate needs the suite's
#                  ../flow/data/packing_ring.vti, which a standalone checkout does not have: it exits
#                  77 (SKIP_RETURN_CODE) and ctest reports it SKIPPED — visible in the log, never a
#                  silent pass. Then a configure-only pass against the PINNED core tag (the wheel's).
#   * mpi        : the same tree with -DPECLET_PNM_MPI=ON; the distributed suite (label `mpi`,
#                  np = 1, 2, 4 oversubscribed on the 4-vCPU runner) + the Python smoke against the
#                  MPI-enabled module.
# Nothing is dropped from `ctest -N` (pnm has no `bench`-labelled instruments; `-LE bench` is the
# family convention). GPU (CUDA/HIP) backends are not exercisable on free runners; the host build is
# backend-agnostic Kokkos source and catches the vast majority of regressions.
#
# Hosted runners have 4 cores / 16 GB: thread pools are BOUNDED (OMP_NUM_THREADS=2 single-rank, 1 for
# MPI) and ctest runs -j1 — an unbounded pool starves the runner ("lost communication with the server").

on:
  push:
    branches: [main, "**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  KOKKOS_TAG: "5.1.1"        # keep in lockstep with ../tools/bootstrap_deps.sh and cmake/PecletDeps.cmake
  NANOBIND_VERSION: "2.13.0" # the suite venv's nanobind; pinned so a nanobind release cannot break CI

jobs:
  # ── Single-rank module + tests ───────────────────────────────────────────────
  build-test:
    name: single-rank (C++ contract + Python smoke + packing_ring gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build libomp-dev g++ python3-dev python3-pip
          python3 -m pip install "nanobind==${NANOBIND_VERSION}" numpy

      - name: Cache Kokkos install
        id: kokkos-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/kokkos-install
          key: kokkos-${{ env.KOKKOS_TAG }}-openmp-${{ runner.os }}

      - name: Build Kokkos (OpenMP + Serial)
        if: steps.kokkos-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$KOKKOS_TAG" https://github.com/kokkos/kokkos.git /tmp/kokkos
          cmake -S /tmp/kokkos -B /tmp/kokkos/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DKokkos_ENABLE_OPENMP=ON -DKokkos_ENABLE_SERIAL=ON \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/kokkos-install"
          cmake --build /tmp/kokkos/build --parallel
          cmake --install /tmp/kokkos/build

      - name: Configure (module + tests)
        run: |
          # main builds against core's main (the vendored default PECLET_CORE_TAG is the last core
          # release, which lags the headers main already uses; the release repins it).
          cmake -S . -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/kokkos-install" \
            -DPECLET_CORE_TAG=main \
            -DPECLET_PNM_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: List tests
        run: ctest --test-dir build -N

      - name: Run all single-rank tests
        env:
          OMP_NUM_THREADS: "2"
          OMP_PROC_BIND: "false"
        run: ctest --test-dir build -LE bench --timeout 1200 --output-on-failure -j1

      # The wheel builds against the PINNED core tag (PECLET_CORE_TAG in cmake/PecletDeps.cmake), not
      # core's main: prove that tag still resolves and configures (headers only; nothing compiled).
      - name: Configure-only against the pinned core tag
        run: |
          cmake -S . -B build_tag -G Ninja \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/kokkos-install" \
            -DPECLET_PNM_BUILD_TESTS=ON

  # ── MPI (distributed) tests ──────────────────────────────────────────────────
  mpi:
    name: MPI tests (OpenMPI, np = 1, 2, 4)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build libomp-dev g++ python3-dev python3-pip \
            libopenmpi-dev openmpi-bin
          python3 -m pip install "nanobind==${NANOBIND_VERSION}" numpy

      - name: Cache Kokkos install
        id: kokkos-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/kokkos-install
          key: kokkos-${{ env.KOKKOS_TAG }}-openmp-${{ runner.os }}

      - name: Build Kokkos (OpenMP + Serial)
        if: steps.kokkos-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$KOKKOS_TAG" https://github.com/kokkos/kokkos.git /tmp/kokkos
          cmake -S /tmp/kokkos -B /tmp/kokkos/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DKokkos_ENABLE_OPENMP=ON -DKokkos_ENABLE_SERIAL=ON \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/kokkos-install"
          cmake --build /tmp/kokkos/build --parallel
          cmake --install /tmp/kokkos/build

      # np=4 on a 4-vCPU runner needs --oversubscribe (OpenMPI counts physical cores as slots).
      - name: Configure (MPI module + tests)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/kokkos-install" \
            -DPECLET_CORE_TAG=main \
            -DPECLET_PNM_MPI=ON \
            -DPECLET_PNM_BUILD_TESTS=ON \
            -DMPIEXEC_EXECUTABLE="$(command -v mpirun)" \
            -DMPIEXEC_PREFLAGS=--oversubscribe

      - name: Build
        run: cmake --build build --parallel

      - name: List tests
        run: ctest --test-dir build -N

      - name: Run the MPI suite
        env:
          OMP_NUM_THREADS: "1"
          OMP_PROC_BIND: "false"
        run: ctest --test-dir build -L mpi --timeout 1200 --output-on-failure -j1

      - name: Python smoke against the MPI-enabled module
        env:
          OMP_NUM_THREADS: "2"
          OMP_PROC_BIND: "false"
        run: ctest --test-dir build -R pnm_python_smoke --timeout 1200 --output-on-failure -j1
